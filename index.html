<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レッスン予約</title>
<link rel="stylesheet" href="core.css">
<style>
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-weight:400;color:var(--sub);margin-left:4px}
.brand em{font-style:normal;font-size:11px;background:var(--warnbg);color:var(--warn);border-radius:4px;padding:1px 6px;margin-left:6px}
.who{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;white-space:nowrap}
.iconbtn{border:0;background:transparent;font-size:20px;padding:2px 8px;line-height:1}
main{flex:1;min-height:0;overflow:auto}
main.fill{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:transparent;padding:8px 0 10px;font-size:12px;color:var(--sub)}
.tabs button b{display:block;font-size:17px;line-height:1.2;color:inherit}
.tabs button.on{color:var(--accent);font-weight:700}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line2)}
.bar .title{font-weight:700;font-size:16px;margin:0 4px}
.bar .grow,.row>.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;white-space:nowrap}
.btn.sq{width:34px;padding:5px 0;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.pri:disabled{opacity:.4;cursor:default}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 8px;font-size:12px}
.bar select,.bar input[type=date]{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--panel)}
.band{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line2);flex-shrink:0}
.band.empty{color:var(--sub);font-size:12px}
.chip{border:1px solid transparent;border-radius:999px;padding:3px 10px;white-space:nowrap;font-size:12px;background:var(--line2)}
.chip.t-absent{background:var(--ev-absent);color:var(--ev-absent-f)}
.chip.t-out{background:var(--ev-out);color:var(--ev-out-f)}
.chip.hol,.chip.t-closed{background:#fde2e2;color:#c0392b}
.chip.t-event{background:var(--ev-event);color:var(--ev-event-f)}
.chip.t-record{background:var(--ev-record);color:var(--ev-record-f)}
.chip.t-clean{background:var(--ev-clean);color:var(--ev-clean-f)}
/* grid */
.gridwrap{flex:1;min-height:0;overflow:auto;background:var(--panel)}
.grid{display:grid;position:relative;min-width:max-content}
.gh{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);border-left:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;grid-row:1}
.gh.corner{left:0;z-index:7;grid-column:1;border-left:0}
.gh.today{color:var(--accent)}
.gh.red{color:#c0392b}
.gh .hn{font-size:10px;font-weight:400;margin-left:4px}
.gh small{font-weight:400;color:var(--sub);margin-left:3px}
.gh.click{cursor:pointer}
.tl{position:sticky;left:0;z-index:4;background:var(--panel);grid-column:1;font-size:11px;color:var(--sub);text-align:right;padding:2px 6px 0 0;border-top:1px solid var(--line)}
.cell{border-left:1px solid var(--line2);border-top:1px solid var(--line)}
.cell.half{border-top:1px dashed var(--line2)}
.cell:hover{background:var(--accentbg)}
.cell.avail{background:var(--accentbg);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.full{background:repeating-linear-gradient(135deg,var(--line2) 0 4px,transparent 4px 8px)}
.cell.free{background:var(--free);box-shadow:inset 0 0 0 1px var(--freeline)}
.wband{grid-row:2;border-left:1px solid var(--line2);border-bottom:1px solid var(--line);padding:2px;display:flex;flex-direction:column;gap:2px;min-height:6px;background:var(--panel)}
.wband .chip{font-size:10px;padding:1px 6px;border-radius:6px;white-space:normal;text-align:left}
.wbar{flex-wrap:nowrap;padding:4px 8px;gap:4px}
.wbar .title{font-size:14px;margin:0 2px;white-space:nowrap}
.wbar .btn{padding:3px 8px}
.wbar .btn.sq{width:28px;padding:3px 0}
.wbar .opt{padding:3px 10px;white-space:nowrap;flex-shrink:0}
.vsep{flex-shrink:0;width:1px;align-self:stretch;margin:2px 4px;background:var(--sub);opacity:.5}
.wchips{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
/* 全部屋の週表示 */
.wall{--wrow:16px;--rh:16px;--wcol:30px;--wtime:28px;--wh1:20px;--wh2:15px}
.wall .gh{font-size:12px}
.wall .tl{font-size:10px;padding-right:3px}
.gh2{position:sticky;top:var(--wh1);z-index:5;background:var(--panel);grid-row:2;font-size:10px;color:var(--sub);text-align:center;line-height:var(--wh2);border-bottom:1px solid var(--line);border-left:1px solid var(--line2)}
.wall .dsep{border-left:2px solid var(--sub)}
.wall .wband{border-bottom:1px solid var(--line)}
.wall .gh,.wall .wband,.wev{min-width:0;overflow:hidden}
.wev{margin:0 1px;padding:0 1px;border-left-width:2px;border-radius:3px;line-height:14px}
.wev .ev-t,.wev .ev-s{text-overflow:clip}
.wev .ev-t{font-size:10px}
.wev .ev-s{font-size:9px}
.ev{z-index:2;margin:1px 2px;border-radius:6px;padding:2px 5px;overflow:hidden;cursor:pointer;
  background:var(--c,#e8e8e8);color:var(--cf,#333);border-left:4px solid var(--cf,#888);line-height:1.2;min-width:0}
.ev-t{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-s{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-s .room{font-weight:700}
.ev-m{font-size:10px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.t-record{--c:var(--ev-record);--cf:var(--ev-record-f)}
.ev.t-clean{--c:var(--ev-clean);--cf:var(--ev-clean-f);background-image:repeating-linear-gradient(135deg,transparent 0 8px,rgba(0,0,0,.05) 8px 16px)}
.ev.t-event{--c:var(--ev-event);--cf:var(--ev-event-f)}
.ev.t-out{--c:var(--ev-out);--cf:var(--ev-out-f)}
.ev.t-absent{--c:var(--ev-absent);--cf:var(--ev-absent-f);background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.06) 6px 12px)}
.ev.t-group{border-left-style:double;border-left-width:6px}
.ev.t-practice{border-left-style:dotted}
.ev.dim{opacity:.5}
.ev.mine{box-shadow:0 0 0 2px var(--cf) inset}
.now{z-index:6;height:2px;background:#e5484d;align-self:start;pointer-events:none;position:relative}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#e5484d}
/* lists */
.wrap{max-width:760px;margin:0 auto;padding:12px}
.sec{margin:16px 0 6px;font-size:13px;color:var(--sub);font-weight:700}
.card{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;border-left:6px solid var(--cf,var(--line))}
.ctime{font-weight:700;min-width:84px;font-variant-numeric:tabular-nums}
.ctime small{display:block;font-weight:400;color:var(--sub)}
.cbody{flex:1;min-width:0;cursor:pointer}
.ctitle{font-weight:700;font-size:16px}
.csub{font-size:12px;color:var(--sub)}
.cnext{font-size:12px;margin-top:2px}
.cnext.none{color:var(--bad);font-weight:700}
.cnext.ok{color:var(--ok)}
.li{display:flex;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;align-items:baseline}
.li .d{min-width:118px;font-variant-numeric:tabular-nums;font-weight:700}
.li .x{flex:1;min-width:0}
.li .x small{color:var(--sub)}
.li.cancel{opacity:.6}
.li.cancel .d{text-decoration:line-through}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;background:var(--line2);color:var(--sub);margin-left:4px;font-weight:400}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.empty-note{color:var(--sub);padding:16px;text-align:center;background:var(--panel);border-radius:12px;border:1px dashed var(--line)}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);font-size:16px}
.krow{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.krow button{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-width:36px;padding:5px 0}
.krow button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.slist{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;text-align:left}
.sbtn small{display:block;color:var(--sub);font-size:11px}
.sbtn .me{color:var(--accent);font-size:10px;font-weight:700}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet-panel{position:relative;background:var(--panel);width:100%;max-width:620px;max-height:92dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.2)}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:16px;max-height:88dvh}}
.shead{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2);gap:8px}
.shead h2{margin:0;font-size:17px;flex:1}
.sbody{overflow:auto;padding:4px 16px 12px;flex:1;min-height:0}
.sfoot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center}
.sfoot .pri{flex:1;padding:11px;font-size:16px}
.fld{margin-top:12px}
.fld>label,.fld>.lab{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:700}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.opt.tc{border-left:5px solid var(--cf)}
.opt.tc.on{background:var(--cf);border-color:var(--cf)}
.opt.busy{opacity:.45;text-decoration:line-through}
.inp{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel);min-width:0}
.inp.wide{width:100%}
.picked{display:flex;align-items:center;gap:8px;background:var(--accentbg);border-radius:10px;padding:8px 10px}
.picked b{font-size:16px;flex:1}
.msg{border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13px}
.msg ul{margin:4px 0 0;padding-left:18px}
.msg.bad{background:var(--badbg);color:var(--bad)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.msg.ok{background:var(--okbg);color:var(--ok);font-weight:700}
.msg.info{background:var(--line2);color:var(--sub)}
.ritem{display:flex;border:1px solid var(--line);border-radius:10px;margin-bottom:4px;background:var(--panel)}
.ritem.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accentbg)}
.rmain{flex:1;min-width:0;text-align:left;background:none;border:0;padding:7px 10px;font-size:13px;color:var(--ink)}
.rst{margin-left:6px;color:var(--ok);font-weight:700}
.ritem.bad .rst{color:var(--bad)}
.rdel{background:none;border:0;border-left:1px solid var(--line2);padding:0 12px;color:var(--sub)}
.cal{max-width:340px}
.ymh{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub);margin:10px 0 3px}
.ymh b{color:var(--ink)}
.yrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:3px;font-size:13px;background:var(--panel)}
.yrow .yd{font-weight:700;min-width:72px;font-variant-numeric:tabular-nums}
.yrow .yd.red{color:#c0392b}
.yrow .yt{flex:1;min-width:0;color:var(--sub)}
.yrow .yst{color:var(--ok);font-weight:700}
.yrow.bad{border-color:var(--bad);background:var(--badbg)}
.yrow.bad .yst{color:var(--bad)}
.yrow.skip{opacity:.5}
.yrow.skip .yd{text-decoration:line-through}
.yedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;margin:0 0 6px;background:var(--accentbg);border-radius:8px;font-size:13px}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.calh b{flex:1;text-align:center}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calg span{text-align:center;font-size:11px;color:var(--sub)}
.calg button{position:relative;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--ink);font-variant-numeric:tabular-nums}
.calg button.past{opacity:.45}
.calg button.sun,.calg button.hol{color:#c0392b}
.calg button.cls{background:repeating-linear-gradient(135deg,var(--line2) 0 4px,transparent 4px 8px)}
.calg button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.calg button.oth{border:2px dashed var(--accent)}
.calg button.has::after{content:'';position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ok)}
.calg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;margin-top:12px}
.kv dt{color:var(--sub);font-size:12px;padding-top:2px}
.kv dd{margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.acts .btn{padding:9px 12px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;background:#222;color:#fff;border-radius:12px;padding:10px 14px;display:none;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
#toast.show{display:flex}
#toast.err{background:var(--bad);cursor:pointer}
/* 通信中の表示（0.5秒以上かかるときだけ出す） */
#busy{position:fixed;top:calc(env(safe-area-inset-top) + 54px);left:50%;transform:translateX(-50%);z-index:70;display:none;align-items:center;gap:8px;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:0 2px 12px rgba(0,0,0,.18);font-size:13px;white-space:nowrap;pointer-events:none}
#busy.show{display:flex}
#busy i{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast button{background:transparent;border:1px solid #fff8;color:#fff;border-radius:8px;padding:4px 10px;white-space:nowrap}
/* 月（全部屋） */
/* 先生ごとの月 */
.tmweek,.tmhead{min-width:640px}
/* 月のヘッダ：狭い画面では、全部屋・先生の切り替えを2行目に回す（表は横にスクロールして見る） */
@media (max-width:760px){
  .wbar.mon{flex-wrap:wrap;row-gap:4px}
  .wbar.mon .vsep{display:none}
  .wbar.mon .wchips{order:9;flex-basis:100%}
}
.tmwrap{flex:1;min-height:0;overflow:auto;padding:8px 10px;background:var(--panel)}
.ptitle{font-size:16px;font-weight:700}
.psum{font-size:12px;color:var(--sub);margin:2px 0 6px}
.tmweek{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) minmax(0,.75fr);border-left:1px solid var(--line)}
.tmweek>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;padding:2px 3px 4px;min-height:64px}
.tmhead{border-top:1px solid var(--line)}
.tmhead>div{min-height:0;text-align:center;font-weight:700;font-size:12px;background:var(--bg);padding:2px}
.tmday.out{background:var(--bg)}
.tmday.out .dn{color:var(--sub);opacity:.6}
.tmday .dn{font-weight:700;font-size:12px;cursor:pointer}
.tmday.today .dn{color:var(--accent)}
.tmday.sun .dn,.tmday.red .dn{color:#c0392b}
.tmday .dn small{font-weight:400;font-size:10px;margin-left:4px}
.tmi{display:flex;flex-wrap:wrap;column-gap:4px;font-size:11px;line-height:1.3;margin-top:2px;padding:1px 3px;border-radius:3px;cursor:pointer;
  background:var(--c,var(--line2));color:var(--ink);border-left:3px solid var(--cf,var(--sub))}
.tmi .tm{font-weight:700;font-variant-numeric:tabular-nums}
.tmi .nm{font-weight:700}
.tmi .rm{font-weight:700;color:var(--cf,var(--ink))}
.tmi .rl{color:var(--sub)}
.tmi.acc{border-left-style:dashed}
.tmi.t-absent,.tmi.t-out,.tmi.t-event,.tmi.t-record,.tmi.t-clean{background:var(--line2);border-left-color:var(--sub)}
@media print{
  @page{size:A4 landscape;margin:8mm}
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--panel:#fff;--bg:#f4f4f4;--ink:#000;--sub:#555;--line:#999;--line2:#e6e6e6;--accent:#1d4ed8}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{height:auto;overflow:visible;background:#fff}
  body{display:block}
  .top,.tabs,.wbar,#sheet,#toast,#busy{display:none!important}
  .tmweek,.tmhead{min-width:0}
  main,main.fill{display:block;overflow:visible}
  .tmwrap{overflow:visible;padding:0}
  .tmweek{break-inside:avoid}
  /* A4横1枚に収まるよう、印刷では文字と余白を詰める */
  .ptitle{font-size:13px}
  .psum{font-size:9px;margin:0 0 3px}
  .tmweek>div{min-height:0;padding:1px 2px 2px}
  .tmday .dn{font-size:9px}
  .tmi{font-size:8px;line-height:1.2;margin-top:1px;padding:0 2px;border-left-width:2px}
  .wrap.stu{max-width:none;padding:0}
  .wrap.stu>:not(.sprint){display:none!important}
  .wrap.stu>.sprint{display:block}
  .wrap.stu[data-p="month"]>.sp-list,.wrap.stu[data-p="list"]>.sp-month{display:none!important}
  .sprint .ptitle{font-size:16pt}
  .sprint .psum{font-size:10pt;margin:1mm 0 3mm}
}
.sprint{display:none}
.ptable{width:100%;border-collapse:collapse;font-size:10.5pt}
.ptable th,.ptable td{border:1px solid #999;padding:1.3mm 2.5mm;text-align:left;font-variant-numeric:tabular-nums}
.ptable th{background:#eee}
.ptable small{color:#555;font-size:9pt}
.pusual{font-size:11pt;margin:0 0 3mm;line-height:1.6}
.pusual small{color:#555;font-size:9pt}
.pmon td{vertical-align:top}
.pmon td.m,.pmon td.n,.pmon th{white-space:nowrap}
.pmon .pd{display:inline-block;margin-right:3mm}
.pmon .pd.ex{font-weight:700}
</style>
</head>
<body>
<header class="top">
  <div class="brand">メヌエット<span>レッスン予約</span></div>
  <button id="who" class="who" data-act="login"></button>
  <button class="iconbtn" data-act="menu" aria-label="メニュー">⋯</button>
</header>
<main id="main"></main>
<nav class="tabs">
  <button data-view="my"><b>●</b>自分</button>
  <button data-view="student"><b>☺</b>生徒</button>
  <button data-view="day"><b>▦</b>日</button>
  <button data-view="week"><b>▥</b>週</button>
  <button data-view="month"><b>▤</b>月</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" data-e="close"></div><div class="sheet-panel" id="panel"></div></div>
<div id="toast"></div>
<div id="busy" role="status" aria-live="polite"><i></i><span></span></div>

<!-- APIのURLとログインのクライアントID（公開してよい値） -->
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<!-- データ・表示名・月の表の描き方など、掲示用ページ（board.html）と共通の部分 -->
<script src="core.js"></script>
<script>
'use strict';
/* ===== ログイン ===== */
// 教室の共通アカウント。表示と編集はできるが、レッスンの担当にはならない
const CLASSROOM = 'ROOM';
const isTeacherLogin = () => !!UI.login && UI.login !== CLASSROOM;
const loginName = () => ME ? ME.name : '';
const KANA_ROWS = [
  ['ア', 'アイウエオヴ'], ['カ', 'カキクケコガギグゲゴ'], ['サ', 'サシスセソザジズゼゾ'], ['タ', 'タチツテトダヂヅデド'],
  ['ナ', 'ナニヌネノ'], ['ハ', 'ハヒフヘホバビブベボパピプペポ'], ['マ', 'マミムメモ'], ['ヤ', 'ヤユヨ'], ['ラ', 'ラリルレロ'], ['ワ', 'ワヲン'],
];

/* ===== 画面の状態 ===== */
const UI = { view: 'my', login: null, date: today(), myDate: today(), week: mondayOf(today()), wf: 'ALL', hl: '', sq: '', krow: '', mineOnly: true, sid: null, wfree: false, mf: 'ALL', sMode: 'future', sMonth: today().slice(0, 8) + '01', month: today().slice(0, 8) + '01', mrow: 7, mfold: true };
const UKEY = 'menuet-yoyaku-ui';
try { const u = JSON.parse(localStorage.getItem(UKEY) || '{}'); if (u.view) UI.view = u.view; if (u.wf) UI.wf = u.wf; if ([7, 10, 13].includes(u.mrow)) UI.mrow = u.mrow; if (typeof u.mfold === 'boolean') UI.mfold = u.mfold; if (u.mf) UI.mf = u.mf; } catch (e) { }
function saveUI() { try { localStorage.setItem(UKEY, JSON.stringify({ view: UI.view, wf: UI.wf, mrow: UI.mrow, mfold: UI.mfold, mf: UI.mf })); } catch (e) { } }

/* ===== 表示用の文字 ===== */
function bandLabel(e) {
  const who = tOf(e).map(tName).join('・');
  if (e.type === 'absent') return `${who}先生 不在`;
  if (e.type === 'out') return `${who}先生 ${e.place || '教室外'}`;
  return evTitle(e) + (who ? `（${who}）` : '');
}
function nextOf(e) {
  const later = x => x.status !== 'cancel' && x.id !== e.id && (x.date > e.date || (x.date === e.date && x.start > e.start));
  let best = null;
  for (const x of S.events) {
    const same = e.type === 'lesson' ? x.studentId === e.studentId && x.type === 'lesson' : e.type === 'group' ? x.type === 'group' && x.group === e.group : false;
    if (same && later(x) && (!best || x.date < best.date || (x.date === best.date && x.start < best.start))) best = x;
  }
  return best;
}
function myStudentIds() {
  const set = new Set();
  for (const e of S.events) if (e.studentId && tOf(e).includes(UI.login)) set.add(e.studentId);
  return set;
}

/* ===== 描画 ===== */
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === UI.view));
  $('#who').textContent = UI.login ? loginName() + ' ▾' : 'ログイン';
  // 共通アカウントには「自分」の予定がないので、タブを出さない
  $('.tabs [data-view="my"]').style.display = UI.login === CLASSROOM ? 'none' : '';
  const m = $('#main');
  if (!ready) {
    m.className = '';
    m.innerHTML = bootFailed ? `<div class="wrap"><div class="msg bad">${esc(bootMsg)}</div><div class="acts"><button class="btn pri" data-act="boot">もう一度試す</button></div></div>`
      : `<div class="wrap"><div class="empty-note">${esc(bootMsg)}</div></div>`;
    return;
  }
  // 表示する期間の予定がまだ読み込まれていなければ、読み込んでから描く
  const vr = viewRange(), retry = msg => `<div class="wrap"><div class="msg bad">${esc(msg)}</div><div class="acts"><button class="btn pri" data-act="retry">もう一度読み込む</button></div></div>`;
  if (((vr && !covered(vr[0], vr[1])) || (UI.view === 'student' && UI.sid && sLoaded !== UI.sid)) && failedRecently()) { m.className = ''; m.innerHTML = retry(loadErrMsg); return; }
  if (vr && !covered(vr[0], vr[1])) { ensureRange(vr[0], vr[1]).then(render); m.className = ''; m.innerHTML = `<div class="wrap"><div class="empty-note">読み込んでいます…</div></div>`; return; }
  if (UI.view === 'student' && UI.sid && sLoaded !== UI.sid) { loadStudent(UI.sid).then(render); m.className = ''; m.innerHTML = `<div class="wrap"><div class="empty-note">読み込んでいます…</div></div>`; return; }
  m.className = ['day', 'week', 'month'].includes(UI.view) ? 'fill' : '';
  const keep = m.querySelector('.gridwrap,.mwrap,.tmwrap'), sx = keep ? keep.scrollLeft : 0, sy = keep ? keep.scrollTop : null;
  m.innerHTML = UI.view === 'day' ? renderDay() : UI.view === 'week' ? renderWeek() : UI.view === 'student' ? renderStudent() : UI.view === 'month' ? renderMonth() : renderMy();
  const g = m.querySelector('.gridwrap,.mwrap,.tmwrap');
  if (g) {
    if (sy !== null && keep.dataset.k === g.dataset.k) { g.scrollLeft = sx; g.scrollTop = sy; }
    else if (g.classList.contains('mwrap')) { const t = g.querySelector('.mday.today'); g.scrollTop = t ? t.closest('.mweek').offsetTop : 0; }
    else if (g.classList.contains('gridwrap')) scrollToNow(g);
  }
  if (UI.view === 'student') bindStudentSearch();
  // スマホで先生のボタンが横にはみ出すとき、選んでいる先生のボタンが見えるようにする
  const on = m.querySelector('.wchips .on');
  if (on) { const c = on.parentElement; c.scrollLeft = on.offsetLeft - c.offsetLeft - (c.clientWidth - on.offsetWidth) / 2; }
}
function scrollToNow(g) {
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  const cs = getComputedStyle(g), rowh = parseFloat(cs.getPropertyValue('--rh') || cs.getPropertyValue('--rowh')) || 34;
  const target = Math.max(0, Math.min(NSLOT, (m - DAY_START) / SLOT - 2));
  g.scrollTop = target * rowh;
}

function dayGrid(d, hl, key) {
  const list = (byDate.get(d) || []).filter(e => e.status !== 'cancel');
  const cols = ROOMS.length;
  let h = `<div class="gridwrap" data-k="${key}"><div class="grid" style="grid-template-columns:var(--timew) repeat(${cols},minmax(var(--colmin),1fr));grid-template-rows:var(--headh) repeat(${NSLOT},var(--rowh))">`;
  h += `<div class="gh corner"></div>`;
  ROOMS.forEach((r, i) => h += `<div class="gh" style="grid-column:${i + 2}">${r.name}</div>`);
  for (let s = 0; s < NSLOT; s += 2) h += `<div class="tl" style="grid-row:${s + 2}/span 2">${hm(DAY_START + s * SLOT)}</div>`;
  for (let s = 0; s < NSLOT; s++) {
    const st = DAY_START + s * SLOT;
    for (let i = 0; i < cols; i++) {
      let cls = 'cell' + (s % 2 ? ' half' : '');
      if (hl && !hard(conflictsOf({ date: d, start: st, len: SLOT, rooms: [ROOMS[i].id], teachers: [hl] })).length) cls += ' free';
      h += `<div class="${cls}" data-cell="${d}|${st}|${ROOMS[i].id}" style="grid-column:${i + 2};grid-row:${s + 2}"></div>`;
    }
  }
  for (const e of list) {
    if (!e.rooms || !e.rooms.length) continue;
    const idx = e.rooms.map(r => ROOMS.findIndex(x => x.id === r)).filter(i => i >= 0).sort((a, b) => a - b);
    const s0 = Math.max(e.start, DAY_START), s1 = Math.min(endOf(e), DAY_END);
    if (s1 <= s0 || !idx.length) continue;
    const row = `grid-row:${(s0 - DAY_START) / SLOT + 2}/span ${(s1 - s0) / SLOT}`;
    let a = idx[0];
    for (let k = 1; k <= idx.length; k++) {
      if (k === idx.length || idx[k] !== idx[k - 1] + 1) { h += evBlock(e, `grid-column:${a + 2}/${idx[k - 1] + 3};${row}`, hl); a = idx[k]; }
    }
  }
  h += nowLine(d, '2/-1');
  return h + '</div></div>';
}
function nowLine(d, col, row0 = 2) {
  if (d !== today()) return '';
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  if (m < DAY_START || m >= DAY_END) return '';
  const s = Math.floor((m - DAY_START) / SLOT), f = ((m - DAY_START) % SLOT) / SLOT;
  return `<div class="now" style="grid-column:${col};grid-row:${s + row0};top:calc(var(--rh, var(--rowh)) * ${f.toFixed(3)})"></div>`;
}
// forTeacher：その先生の週を見るとき。2行目に部屋と、一緒に入る先生（伴奏・メイン）を出す
function evBlock(e, style, hl, forTeacher) {
  const cls = ['ev', 't-' + e.type];
  if (hl) cls.push(tOf(e).includes(hl) ? 'mine' : 'dim');
  const short = e.len <= 30;
  let sub = esc(evWho(e));
  if (forTeacher) {
    const ts = tOf(e), others = ts.filter(t => t !== forTeacher).map(tName);
    const role = TYPES[e.type].teachers === 'mainsub' ? (ts[0] === forTeacher ? (others.length ? '伴 ' + others.join('・') : '') : '伴奏（' + tName(ts[0]) + '）') : others.join('・');
    sub = (e.rooms && e.rooms.length ? `<b class="room">${esc(roomsText(e.rooms))}</b> ` : '') + esc(role);
  }
  return `<div class="${cls.join(' ')}" data-ev="${e.id}" style="${style};${teacherStyle(e)}">` +
    `<div class="ev-t">${esc(evTitle(e))}</div><div class="ev-s">${sub}</div>` +
    (short ? '' : `<div class="ev-m">${evTime(e)}${e.memo ? ' ' + esc(e.memo) : ''}</div>`) + `</div>`;
}
function band(d) {
  const items = (byDate.get(d) || []).filter(e => e.status !== 'cancel' && (e.allDay || !(e.rooms && e.rooms.length))).sort((a, b) => a.start - b.start);
  const hol = holidayName(d);
  if (!items.length && !hol) return `<div class="band empty">終日の予定・不在や教室外の先生はいません</div>`;
  return `<div class="band">${hol ? `<span class="chip hol"><b>${esc(hol)}</b></span>` : ''}${items.map(e => `<button class="chip t-${e.type}" data-ev="${e.id}"><b>${esc(bandLabel(e))}</b> ${evTime(e)}</button>`).join('')}</div>`;
}
// 週の見出しの日付。祝日なら名前を添える
const dayHead = d => md(d) + (holidayName(d) ? `<span class="hn">${esc(holidayName(d))}</span>` : '');
function teacherOptions(sel, emptyLabel) {
  return `<option value="">${emptyLabel}</option>` + activeTeachers().map(t => `<option value="${t.id}"${t.id === sel ? ' selected' : ''}>${esc(t.full)}先生</option>`).join('');
}

function renderDay() {
  const d = UI.date;
  return `<div class="bar">
    <button class="btn sq" data-act="day-1">‹</button>
    <span class="title">${md(d)}</span>
    <button class="btn sq" data-act="day+1">›</button>
    <button class="btn" data-act="dayToday">今日</button>
    <input type="date" data-act="dayPick" value="${d}">
    <span class="grow"></span>
    <label>空き：<select data-act="hl">${teacherOptions(UI.hl, '表示しない')}</select></label>
  </div>${band(d)}${dayGrid(d, UI.hl, 'day' + d)}`;
}

function renderWeek() {
  // 週は「全部屋」か「先生ごと」。部屋ごとの表示はなし（前に保存された部屋の指定は全部屋に戻す）
  if (!(UI.wf === 'ALL' || TMAP.has(UI.wf))) UI.wf = 'ALL';
  const ws = UI.week, days = [...Array(7).keys()].map(i => addDays(ws, i)), f = UI.wf, isRoom = false;
  const chip = (v, l, st) => `<button class="opt${st ? ' tc' : ''}${f === v ? ' on' : ''}"${st ? ` style="--cf:${st}"` : ''} data-act="wf" data-v="${v}">${esc(l)}</button>`;
  // ヘッダは1行にまとめる（週の移動・表示の切り替え・空き）
  let h = `<div class="bar wbar">
    <button class="btn sq" data-act="week-1">‹</button>
    <span class="title">${md(ws)}〜</span>
    <button class="btn sq" data-act="week+1">›</button>
    <button class="btn" data-act="weekThis">今週</button>
    <span class="vsep"></span>
    <div class="wchips">${chip('ALL', '全部屋')}${activeTeachers().map(t => chip(t.id, t.name, t.fg)).join('')}</div>
    ${TMAP.has(f) ? `<button class="opt${UI.wfree ? ' on' : ''}" data-act="wfree">空き</button>` : ''}
  </div>`;
  if (f === 'ALL') return h + weekAllGrid(ws, days);
  h += `<div class="gridwrap" data-k="week${ws}${f}" style="--headh:24px"><div class="grid" style="grid-template-columns:var(--timew) repeat(7,minmax(var(--colmin),1fr));grid-template-rows:var(--headh) auto repeat(${NSLOT},var(--rowh))">`;
  h += `<div class="gh corner"></div><div class="tl" style="grid-row:2;border-top:0"></div>`;
  days.forEach((d, i) => {
    h += `<div class="gh click${d === today() ? ' today' : ''}${isRedDay(d) ? ' red' : ''}" style="grid-column:${i + 2}" data-act="gotoDay" data-d="${d}">${dayHead(d)}</div>`;
    const chips = (byDate.get(d) || []).filter(e => e.status !== 'cancel' && !(e.rooms && e.rooms.length) && !(e.teachers && e.teachers.length));
    h += `<div class="wband" style="grid-column:${i + 2}">${chips.map(e => `<button class="chip t-${e.type}" data-ev="${e.id}">${esc(evTitle(e))}</button>`).join('')}</div>`;
  });
  for (let s = 0; s < NSLOT; s += 2) h += `<div class="tl" style="grid-row:${s + 3}/span 2">${hm(DAY_START + s * SLOT)}</div>`;
  days.forEach((d, i) => {
    for (let s = 0; s < NSLOT; s++) {
      const st = DAY_START + s * SLOT;
      // 先生ごとで「空き」を押したとき：先生も部屋も空いている枠を色付けし、先生は空いているのに部屋が埋まっている枠は斜線にする
      let mark = '';
      if (UI.wfree && f !== 'ALL' && !hard(conflictsOf({ date: d, start: st, len: SLOT, rooms: [], teachers: [f] })).length) mark = freeRoom(d, st, f) ? ' avail' : ' full';
      h += `<div class="cell${s % 2 ? ' half' : ''}${mark}" data-wcell="${d}|${st}" style="grid-column:${i + 2};grid-row:${s + 3}"></div>`;
    }
    for (const e of byDate.get(d) || []) {
      if (e.status === 'cancel') continue;
      if (isRoom ? !(e.rooms || []).includes(f) : !tOf(e).includes(f)) continue;
      const s0 = Math.max(e.start, DAY_START), s1 = Math.min(endOf(e), DAY_END);
      if (s1 <= s0) continue;
      h += evBlock(e, `grid-column:${i + 2};grid-row:${(s0 - DAY_START) / SLOT + 3}/span ${(s1 - s0) / SLOT}`, '', isRoom ? '' : f);
    }
    if (d === today()) h += nowLine(d, String(i + 2), 3);
  });
  return h + '</div></div>';
}
// その時間（30分）に先生 tid が空いていれば、空いている最初の部屋を返す。先生か部屋が空いていなければ null
function freeRoom(d, st, tid) {
  if (hard(conflictsOf({ date: d, start: st, len: SLOT, rooms: [], teachers: [tid] })).length) return null;
  const r = ROOMS.find(r => !hard(conflictsOf({ date: d, start: st, len: SLOT, rooms: [r.id], teachers: [] })).length);
  return r ? r.id : null;
}
// 全部屋の週表示：7日×部屋の列を細く並べ、生徒は名字だけ出す
const roomShort = r => (r.name.match(/\d+$/) || [r.name.slice(0, 2)])[0];
function weekAllGrid(ws, days) {
  const R = ROOMS.length, hl = '', ROW0 = 4;
  // 列の幅を中身の長さで広げないよう、表の幅を画面幅（狭ければ最小幅）に固定する
  let h = `<div class="gridwrap wall" data-k="weekall${ws}"><div class="grid" style="width:100%;min-width:calc(var(--wtime) + ${7 * R} * var(--wcol));grid-template-columns:var(--wtime) repeat(${7 * R},minmax(var(--wcol),1fr));grid-template-rows:var(--wh1) var(--wh2) auto repeat(${NSLOT},var(--wrow))">`;
  h += `<div class="gh corner" style="grid-row:1/3"></div><div class="tl" style="grid-row:3;border-top:0"></div>`;
  days.forEach((d, i) => {
    const c0 = 2 + i * R;
    h += `<div class="gh click dsep${d === today() ? ' today' : ''}${isRedDay(d) ? ' red' : ''}" style="grid-column:${c0}/span ${R}" data-act="gotoDay" data-d="${d}">${dayHead(d)}</div>`;
    ROOMS.forEach((r, k) => h += `<div class="gh2${k ? '' : ' dsep'}" style="grid-column:${c0 + k}" title="${esc(r.name)}">${esc(roomShort(r))}</div>`);
    const chips = (byDate.get(d) || []).filter(e => e.status !== 'cancel' && (e.allDay || !(e.rooms && e.rooms.length))).sort((a, b) => a.start - b.start);
    h += `<div class="wband dsep" style="grid-column:${c0}/span ${R};grid-row:3">${chips.map(e => `<button class="chip t-${e.type}" data-ev="${e.id}">${esc(bandLabel(e))} ${e.allDay ? '' : hm(e.start) + '–' + hm(e.start + e.len)}</button>`).join('')}</div>`;
  });
  for (let s = 0; s < NSLOT; s += 2) h += `<div class="tl" style="grid-row:${s + ROW0}/span 2">${DAY_START / 60 + s / 2}</div>`;
  days.forEach((d, i) => {
    const c0 = 2 + i * R, list = (byDate.get(d) || []).filter(e => e.status !== 'cancel');
    for (let s = 0; s < NSLOT; s++) {
      const st = DAY_START + s * SLOT;
      ROOMS.forEach((r, k) => {
        let cls = 'cell' + (s % 2 ? ' half' : '') + (k ? '' : ' dsep');
        if (hl && !hard(conflictsOf({ date: d, start: st, len: SLOT, rooms: [r.id], teachers: [hl] })).length) cls += ' free';
        h += `<div class="${cls}" data-cell="${d}|${st}|${r.id}" style="grid-column:${c0 + k};grid-row:${s + ROW0}"></div>`;
      });
    }
    for (const e of list) {
      if (!e.rooms || !e.rooms.length) continue;
      const idx = e.rooms.map(r => ROOMS.findIndex(x => x.id === r)).filter(x => x >= 0).sort((a, b) => a - b);
      const s0 = Math.max(e.start, DAY_START), s1 = Math.min(endOf(e), DAY_END);
      if (s1 <= s0 || !idx.length) continue;
      const row = `grid-row:${(s0 - DAY_START) / SLOT + ROW0}/span ${(s1 - s0) / SLOT}`;
      const tip = `${evTime(e)} ${roomsText(e.rooms)} ${evTitle(e)}（${evWho(e)}）`;
      let a = idx[0];
      for (let k = 1; k <= idx.length; k++) {
        if (k === idx.length || idx[k] !== idx[k - 1] + 1) {
          const cls = ['ev', 'wev', 't-' + e.type];
          if (hl) cls.push(tOf(e).includes(hl) ? 'mine' : 'dim');
          h += `<div class="${cls.join(' ')}" data-ev="${e.id}" title="${esc(tip)}" style="grid-column:${c0 + a}/${c0 + idx[k - 1] + 1};${row};${teacherStyle(e)}">` +
            `<div class="ev-t">${esc(shortTitle(e))}</div>${endOf(e) - e.start >= 60 && tOf(e).length ? `<div class="ev-s">${esc(tName(tOf(e)[0]))}</div>` : ''}</div>`;
          a = idx[k];
        }
      }
    }
    if (d === today()) h += nowLine(d, `${c0}/span ${R}`, ROW0);
  });
  return h + '</div></div>';
}

// 月の全部屋：日ごとの枠に部屋の列と時刻の行を並べ、生徒の名字だけを出す。メインの先生は色で見分ける
function renderMonth() {
  const first = UI.month, f = pd(first), y = f.getFullYear(), mo = f.getMonth();
  const last = ds(new Date(y, mo + 1, 0)), fold = UI.mfold;
  if (!(UI.mf === 'ALL' || TMAP.has(UI.mf))) UI.mf = 'ALL';
  const mf = UI.mf;
  const chip = (v, l, st) => `<button class="opt${st ? ' tc' : ''}${mf === v ? ' on' : ''}"${st ? ` style="--cf:${st}"` : ''} data-act="mf" data-v="${v}">${esc(l)}</button>`;
  // ヘッダは週と同じ1行：月の移動｜全部屋・先生｜表示の設定（全部屋）または印刷（先生ごと）
  let h = `<div class="bar wbar mon">
    <button class="btn sq" data-act="mon-1">‹</button><span class="title">${y}年${mo + 1}月</span><button class="btn sq" data-act="mon+1">›</button>
    <button class="btn" data-act="monThis">今月</button>
    <span class="vsep"></span>
    <div class="wchips">${chip('ALL', '全部屋')}${activeTeachers().map(t => chip(t.id, t.name, t.fg)).join('')}</div>
    <span class="vsep"></span>`;
  if (mf === 'ALL') {
    h += `${[[7, '小'], [10, '中'], [13, '大']].map(([v, l]) => `<button class="opt${UI.mrow === v ? ' on' : ''}" data-act="mSize" data-v="${v}">${l}</button>`).join('')}
    <button class="opt${fold ? '' : ' on'}" data-act="mFold" data-v="0" title="1日を1列で">1列</button><button class="opt${fold ? ' on' : ''}" data-act="mFold" data-v="1" title="1日を9〜15時と15〜21時の2列で">2列</button></div>`;
    const weeks = [];
    for (let ws = mondayOf(first); ws <= last; ws = addDays(ws, 7)) weeks.push(ws);
    return h + monthGrid(weeks, d => d < first || d > last, fold, `--mrow:${UI.mrow}px`, 'month' + first + fold);
  }
  h += `<button class="btn" data-act="print">印刷</button></div>`;
  return h + teacherMonth(first, last, mf);
}
// 先生ごとの月：カレンダーの日ごとに、その先生の予定を時間順に1行ずつ（時間・生徒・部屋・伴奏）並べる。印刷して配れるようにする
function teacherMonth(first, last, tid) {
  const t = TMAP.get(tid), f = pd(first);
  const mine = d => (byDate.get(d) || []).filter(e => e.status !== 'cancel' && tOf(e).includes(tid)).sort((a, b) => a.start - b.start);
  // 月のまとめ：メインで持つレッスン、伴奏で入るレッスン、教室外・不在の日数
  let main = 0, acc = 0, mins = 0;
  for (let d = first; d <= last; d = addDays(d, 1)) for (const e of mine(d)) {
    if (e.type !== 'lesson' && e.type !== 'group') continue;
    if (tOf(e)[0] === tid) main++; else acc++;
    mins += e.len;
  }
  const line = e => {
    const ts = tOf(e), others = ts.filter(x => x !== tid).map(tName);
    let role = '';
    if (TYPES[e.type].teachers === 'mainsub') role = ts[0] === tid ? (others.length ? '伴 ' + others.join('・') : '') : '伴奏（' + tName(ts[0]) + '）';
    else if (others.length) role = others.join('・');
    const what = e.type === 'absent' ? '不在' : e.type === 'out' ? (e.place || '教室外') : evTitle(e);
    return `<div class="tmi t-${e.type}${ts[0] !== tid && TYPES[e.type].teachers === 'mainsub' ? ' acc' : ''}" data-ev="${e.id}" style="${teacherStyle(e)}">` +
      `<span class="tm">${e.allDay ? '終日' : hm(e.start) + '–' + hm(e.start + e.len)}</span><span class="nm">${esc(what)}</span>` +
      (e.rooms && e.rooms.length ? `<span class="rm">${esc(roomsText(e.rooms))}</span>` : '') + (role ? `<span class="rl">${esc(role)}</span>` : '') + `</div>`;
  };
  let h = `<div class="tmwrap" data-k="tmonth${first}${tid}">
    <div class="ptitle">${f.getFullYear()}年${f.getMonth() + 1}月　${esc(t.full)}先生のレッスン予定</div>
    <div class="psum">レッスン ${main}コマ・伴奏 ${acc}コマ（計${mins / 60 | 0}時間${mins % 60 ? mins % 60 + '分' : ''}）　印刷日 ${md(today())}</div>
    <div class="tmweek tmhead">${['月', '火', '水', '木', '金', '土', '日'].map(w => `<div>${w}</div>`).join('')}</div>`;
  for (let ws = mondayOf(first); ws <= last; ws = addDays(ws, 7)) {
    h += `<div class="tmweek">`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i), out = d < first || d > last;
      // 薄くした前後の月の日は、予定を出さない（印刷して紛らわしくないように）
      h += `<div class="tmday${out ? ' out' : ''}${d === today() ? ' today' : ''}${i === 6 ? ' sun' : ''}${!out && isRedDay(d) ? ' red' : ''}"><div class="dn" data-act="gotoDay" data-d="${d}">${pd(d).getDate()}${!out && (holidayName(d) || closedName(d)) ? `<small>${esc(holidayName(d) || closedName(d))}</small>` : ''}</div>${out ? '' : mine(d).map(line).join('')}</div>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}

function studentMatches(q, krow, mineOnly) {

const monthOf = d => d.slice(0, 8) + '01';

/* 曜日で決める：始める日（D.date）の曜日で、終わりの日まで毎週。月の第何週に入れるか（D.wks）で月4回・月2回などにする。

  const d = pd(D.date);

  if (D.untilKind === 'half') return addDays(ds(new Date(d.getFullYear(), d.getMonth() + 6, d.getDate())), -1);

// 通信中の表示。始めるときに busyStart(文) を呼び、返ってきた関数を終わったときに呼ぶ。
// すぐ終わるものでちらつかないよう、0.5秒たっても終わっていないときだけ出す
const busyJobs = new Map();

  // 同時にいくつか動いているときは、保存 → ログイン → 読み込みの順に優先して出す
  const labels = [...busyJobs.values()];
  el.querySelector('span').textContent = labels.find(l => l.startsWith('保存')) || labels.find(l => l.includes('ログイン')) || labels[labels.length - 1];
  if (!el.classList.contains('show') && !busyTimer) busyTimer = setTimeout(() => { busyTimer = null; if (busyJobs.size) el.classList.add('show'); }, 500);

// ログインは Google の IDトークン（1時間有効）。APIを呼ぶたびに送り、Apps Script 側で本物か・許可された人かを確かめる
const CFG = window.MENUET_CONFIG || {};
const TOKEN_KEY = 'menuet-yoyaku-token';
let ME = null, SV = null, ready = false, bootMsg = 'ログインしてください', bootFailed = false, token = null, tokenWaiters = [];
try { const t = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); if (t && t.exp * 1000 > Date.now() + 60000) token = t; } catch (e) { }

let gisWait = 0;
function gisReady(fn) {
  if (!(window.google && google.accounts && google.accounts.id)) {

    if (++gisWait === 50) { toastErr('Google のログインの準備ができません。通信を確かめて、ページを読み込み直してください'); if (!ready) { bootMsg = 'Google のログインの準備ができません。通信を確かめて、ページを読み込み直してください'; bootFailed = true; render(); } }
    return void setTimeout(() => gisReady(fn), 200);
  }
  gisWait = 0;
  if (!gisInit) {
    google.accounts.id.initialize({ client_id: CFG.clientId, callback: onCredential, auto_select: true, cancel_on_tap_outside: false, use_fedcm_for_prompt: true });
    gisInit = true;

function onCredential(r) {
  const p = JSON.parse(atob(r.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
  token = { cred: r.credential, exp: p.exp, email: p.email };
  try { localStorage.setItem(TOKEN_KEY, JSON.stringify(token)); } catch (e) { }
  const w = tokenWaiters; tokenWaiters = []; w.forEach(f => f(token.cred));
  if ($('#gbtn')) closeSheet();
  if (!ready) start();
}
// 有効なトークンを返す。期限が切れていれば Google に取り直してもらい、だめならログインの画面を出す
function getToken() {
  if (token && token.exp * 1000 > Date.now() + 60000) return Promise.resolve(token.cred);
  return new Promise(resolve => {
    tokenWaiters.push(resolve);
    if (tokenWaiters.length > 1) return;
    gisReady(() => google.accounts.id.prompt());
    setTimeout(() => { if (tokenWaiters.length && !$('#gbtn')) openLogin('ログインの期限が切れました。もう一度ログインしてください'); }, 6000);
  });
}
// 操作ごとの「処理中」の文。version（数分おきの確かめ）は裏で静かに行うので出さない
const BUSY_LABEL = { init: 'ログインしています…', events: '予定を読み込んでいます…', student: '予定を読み込んでいます…', log: '読み込んでいます…',

  try { return await callApi(action, params); } finally { done(); }
}
async function callApi(action, params) {
  let cred;
  if (token && token.exp * 1000 > Date.now() + 60000) cred = token.cred;
  else { const done = busyStart('ログインを確かめています…'); try { cred = await getToken(); } finally { done(); } }
  let res;
  try {
    // Content-Type を text/plain にして、ブラウザの事前の問い合わせ（プリフライト）を避ける
    res = await fetch(CFG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...params, action, token: cred }) });
  } catch (e) { throw new Error('通信できませんでした。電波の状態を確かめて、もう一度試してください'); }
  const j = await res.json().catch(() => ({ ok: false, error: 'サーバーの返事を読めませんでした。少し待ってからもう一度試してください' }));
  if (!j.ok) {
    const err = new Error(j.error); err.code = j.code; err.conflicts = j.conflicts;
    if (j.code === 'auth' || j.code === 'forbidden') {
      token = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) { }
      openLogin(j.error);
    }
    throw err;
  }
  return j;
}
// 起動：自分・先生・部屋・生徒を読み、今日の前後の予定を読む
async function start() {
  bootMsg = '読み込んでいます…'; bootFailed = false; render();
  try {
    const j = await api('init');
    ME = j.me; SV = j.version;
    setMaster(j);
    UI.login = ME.teacherId || CLASSROOM;
    if (UI.login === CLASSROOM && UI.view === 'my') UI.view = 'day';
    await ensureRange(addDays(today(), -42), addDays(today(), 120));
    ready = true;
    render();
  } catch (e) { bootMsg = e.message; bootFailed = !['auth', 'forbidden'].includes(e.code); render(); }
}

// 読み込んだ期間（LR＝[from, to]）。足りない分だけ取りに行く。1回に取るのは1年分まで
let LR = null, loadChain = Promise.resolve(), sLoaded = null;
// 読み込みに失敗したとき（電波が悪いなど）は、しばらく自動で読み直さない（何度も失敗を繰り返さないように）
let loadErr = 0, loadErrMsg = '';
const failedRecently = () => Date.now() - loadErr < 15000;
const onLoadError = e => { loadErr = Date.now(); loadErrMsg = e.message; if (!['auth', 'forbidden'].includes(e.code)) toastErr(e.message); };
const covered = (f, t) => !!LR && f >= LR[0] && t <= LR[1];
function chunks(a, b) {
  const out = [];
  for (let x = a; x <= b; x = addDays(x, 366)) out.push([x, addDays(x, 365) < b ? addDays(x, 365) : b]);
  return out;
}
function ensureRange(f, t) {
  loadChain = loadChain.then(async () => {
    if (covered(f, t)) return;
    const nf = LR && LR[0] < f ? LR[0] : f, nt = LR && LR[1] > t ? LR[1] : t;
    const parts = LR ? [[nf, addDays(LR[0], -1)], [addDays(LR[1], 1), nt]].filter(([a, b]) => a <= b) : [[nf, nt]];
    for (const [a0, b0] of parts) for (const [a, b] of chunks(a0, b0)) { const j = await api('events', { from: a, to: b }); setEvents(j.events, a, b); }
    LR = [nf, nt];
  }).catch(onLoadError);
  return loadChain;
}
// 読み込んだ期間をすべて読み直す（ほかの人が予定を変えたとき）
function reloadAll() {
  loadChain = loadChain.then(async () => {
    if (!LR) return;
    for (const [a, b] of chunks(LR[0], LR[1])) { const j = await api('events', { from: a, to: b }); setEvents(j.events, a, b); SV = j.version; }
    if (sLoaded) { const j = await api('student', { id: sLoaded }); mergeEvents(j.events); }
  }).catch(onLoadError);
  return loadChain.then(() => { if ($('#sheet').classList.contains('hidden')) render(); else if (D) updateCheck(); });
}
// 生徒1人の予定をすべて読む（生徒の画面の「これから」「これまで」用）
function loadStudent(id) {
  loadChain = loadChain.then(async () => { const j = await api('student', { id }); mergeEvents(j.events); sLoaded = id; }).catch(onLoadError);
  return loadChain;
}
// 今の画面に要る期間
function viewRange() {
  if (UI.view === 'day') return [UI.date, UI.date];
  if (UI.view === 'week') return [UI.week, addDays(UI.week, 6)];
  if (UI.view === 'my') return [UI.myDate, UI.myDate];
  if (UI.view === 'month') { const f = pd(UI.month), last = ds(new Date(f.getFullYear(), f.getMonth() + 1, 0)); return [mondayOf(UI.month), addDays(mondayOf(last), 6)]; }
  return null;
}
// 予約の入力で、要る期間が読み込まれていなければ読み込んで描き直す（読み込み中は false）
function needForDraft(f, t) {
  if (covered(f, t)) return true;
  if (failedRecently()) return false;
  const open = D;
  ensureRange(f, t).then(() => { if (D && D === open) renderEditor(); });
  return false;
}
// 予定を書き換える操作をAPIに送り、返ってきた予定を画面に反映する。then：うまくいったあとに続けること
async function mutate(action, params, okMsg, then) {
  const box = $('#cbox'), btn = $('#saveBtn');
  if (D) D.saving = true;
  if (btn) { btn.disabled = true; btn.textContent = '保存しています…'; }
  document.querySelectorAll('#panel .acts .btn').forEach(b => b.disabled = true);
  const before = SV;
  try {
    const j = await api(action, params);
    mergeEvents(j.events, j.removed);
    // その間にほかの人も変えていたら、読み直す
    const others = before != null && j.version !== before + 1;
    SV = j.version;
    if (then) then(); else closeSheet();
    render();
    toastMsg(okMsg);
    if (others) reloadAll();
  } catch (e) {
    if (D) D.saving = false;
    document.querySelectorAll('#panel .acts .btn').forEach(b => b.disabled = false);
    if (e.code === 'auth' || e.code === 'forbidden') return;
    const msg = `<div class="msg bad"><b>${esc(e.message)}</b>${e.conflicts ? `<ul>${e.conflicts.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}</div>`;
    if (box) { box.innerHTML = msg; box.scrollIntoView({ block: 'nearest' }); if (btn) { btn.disabled = false; btn.textContent = 'もう一度入れる'; } }
    else toastErr(e.message);
    if (e.code === 'conflict' || e.code === 'gone') reloadAll();
  }
}
// 数分おきと、画面に戻ったときに、ほかの人が予定を変えていないか確かめる
async function checkVersion() {
  if (!ready || document.hidden) return;
  try { const j = await api('version'); if (j.version !== SV) { SV = j.version; reloadAll(); } } catch (e) { }
}
setInterval(checkVersion, 90 * 1000);
document.addEventListener('visibilitychange', checkVersion);

/* ===== 操作 ===== */
function setView(v) { UI.view = v; saveUI(); render(); }
document.addEventListener('click', ev => {
  const t = ev.target;
  // シートの中
  const se = t.closest('[data-e]');
  if (se && se.closest('#sheet')) { ev.preventDefault(); return sheetAction(se.dataset.e, se.dataset.v, se); }
  const ep = t.closest('[data-ep]');
  if (ep && D) return pickerAction(ep.dataset.ep, D, () => { renderEditor(); });
  const sp = t.closest('[data-sp]');
  if (sp) return pickerAction(sp.dataset.sp, UI, () => render(), true);
  const vw = t.closest('[data-view]');
  if (vw) return setView(vw.dataset.view);
  const evEl = t.closest('[data-ev]');
  if (evEl) return openDetail(evEl.dataset.ev);
  const cell = t.closest('[data-cell]');
  if (cell) {
    const [d, st, room] = cell.dataset.cell.split('|');
    return openEditor({ date: d, start: +st, rooms: [room], teachers: UI.hl ? [UI.hl] : isTeacherLogin() ? [UI.login] : [] });
  }
  const wc = t.closest('[data-wcell]');
  if (wc) {
    const [d, st] = wc.dataset.wcell.split('|'), f = UI.wf;
    return openEditor(f.startsWith('R') ? { date: d, start: +st, rooms: [f] } : f === 'ALL' ? { date: d, start: +st } : { date: d, start: +st, teachers: [f], rooms: [freeRoom(d, +st, f) || 'R1'] });
  }
  const a = t.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (a.tagName === 'SELECT' || (a.tagName === 'INPUT' && a.type === 'date')) return;
  switch (act) {
    case 'login': return ready ? openMenu() : openLogin();
    case 'retry': loadErr = 0; break;
    case 'boot': return token ? start() : openLogin();
    case 'menu': return openMenu();
    case 'day-1': UI.date = addDays(UI.date, -1); break;
    case 'day+1': UI.date = addDays(UI.date, 1); break;
    case 'dayToday': UI.date = today(); break;
    case 'week-1': UI.week = addDays(UI.week, -7); break;
    case 'week+1': UI.week = addDays(UI.week, 7); break;
    case 'weekThis': UI.week = mondayOf(today()); break;
    case 'gotoDay': UI.date = a.dataset.d; UI.view = 'day'; break;
    case 'wf': UI.wf = a.dataset.v; saveUI(); break;
    case 'wfree': UI.wfree = !UI.wfree; break;
    case 'my-1': UI.myDate = addDays(UI.myDate, -1); break;
    case 'my+1': UI.myDate = addDays(UI.myDate, 1); break;
    case 'myToday': UI.myDate = today(); break;
    case 'new': return openEditor({ date: UI.myDate });
    case 'next': return nextFrom(getEv(a.dataset.id));
    case 'makeup': return openMakeup(getEv(a.dataset.id));
    case 'sback': UI.sid = null; if (history.state && history.state.sid) navPop(); break;
    case 'sMode': UI.sMode = a.dataset.v; break;
    case 'sMon-1': case 'sMon+1': { const d = pd(UI.sMonth); d.setMonth(d.getMonth() + (act === 'sMon-1' ? -1 : 1)); UI.sMonth = ds(d); break; }
    case 'sMonThis': UI.sMonth = today().slice(0, 8) + '01'; break;
    case 'newFor': return openEditor({ studentId: a.dataset.id, date: today() });
    case 'bExit': if (document.fullscreenElement) document.exitFullscreen(); return setView('day');
    case 'mon-1': case 'mon+1': { const d = pd(UI.month); d.setMonth(d.getMonth() + (act === 'mon-1' ? -1 : 1)); UI.month = ds(d); break; }
    case 'monThis': UI.month = today().slice(0, 8) + '01'; break;
    case 'mSize': UI.mrow = +a.dataset.v; saveUI(); break;
    case 'mf': UI.mf = a.dataset.v; saveUI(); break;
    case 'print': return window.print();
    case 'sPrint': {
      // 生徒の予定はA4縦で印刷する（ほかの印刷はA4横）。一覧か月ごとかは data-p で選ぶ
      $('.wrap.stu').dataset.p = a.dataset.v;
      const st = document.createElement('style');
      st.textContent = '@page{size:A4 portrait;margin:12mm}';
      document.head.appendChild(st);
      window.addEventListener('afterprint', () => st.remove(), { once: true });
      return window.print();
    }
    case 'mFold': UI.mfold = a.dataset.v === '1'; saveUI(); break;
    default: return;
  }
  render();
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.closest('#sheet') && t.dataset.f && D) {
    const f = t.dataset.f;
    if (f === 'start') { D.start = +t.value; normalizeDraft(); }
    else if (f === 'len' || f === 'count') { D[f] = +t.value; normalizeDraft(); }
    else if (f === 'allDay' || f === 'applySeries') D[f] = t.checked;
    else if (f === 'until') { if (t.value) { D.until = t.value; D.untilKind = 'custom'; } }
    else if (f === 'ovDate' || f === 'ovStart' || f === 'ovRoom') {
      const b = t.dataset.b, o = { ...D.ov[b] };
      if (f === 'ovDate') { if (!t.value) return; o.date = t.value === b ? undefined : t.value; }
      if (f === 'ovStart') o.start = +t.value;
      if (f === 'ovRoom') o.room = t.value;
      D.ov[b] = o;
    }
    else return;
    return renderEditor();
  }
  const act = t.dataset.act;
  if (act === 'dayPick' && t.value) { UI.date = t.value; render(); }
  if (act === 'hl') { UI.hl = t.value; render(); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (!t.closest('#sheet') || !t.dataset.f || !D) return;
  const f = t.dataset.f;
  if (f === 'sq') { D.sq = t.value; $('#epick').innerHTML = studentPicker(D.sq, D.krow, D.mineOnly, 'ep'); return; }
  if (['title', 'group', 'place', 'memo'].includes(f)) { D[f] = t.value; updateCheck(); }
});
function pickerAction(v, st, redraw, isView) {
  if (v === 'mine') { st.mineOnly = !st.mineOnly; }
  else if (v[0] === 'k') { const k = v.slice(1); st.krow = st.krow === k ? '' : k; }
  else if (v[0] === 's') {
    const id = v.slice(1);
    if (isView) { UI.sid = id; sidFrom = null; navPush({ sid: id }); return render(); }
    D.studentId = id; D.sq = '';
    if (!D.editing && !D.makeupOf) suggestFromHistory(id);
  }
  redraw();
}
// 生徒を選んだとき、その生徒のいつもの先生・伴奏を入れておく（長さは30分のまま）
function suggestFromHistory(id) {
  const hist = S.events.filter(e => e.studentId === id && e.type === 'lesson' && (!isTeacherLogin() || tOf(e)[0] === UI.login)).sort((a, b) => a.date < b.date ? 1 : -1)[0];
  if (hist) { D.teachers = [...hist.teachers]; normalizeDraft(); }
}
function sheetAction(e, v, el) {
  switch (e) {
    case 'close': return closeSheet();
    case 'log': return openLog();
    case 'reload': closeSheet(); return reloadAll().then(() => toastMsg('最新の予定を読み直しました'));
    case 'logout':
      token = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) { }
      if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
      return location.reload();
    case 'open': return openDetail(v);
    case 'edit': { const x = getEv(v); return openEditor({ ...JSON.parse(JSON.stringify(x)), editing: x.id, repeat: 'none', sq: '', krow: '', mineOnly: isTeacherLogin() }); }
    case 'nextOf': return nextFrom(getEv(v));
    case 'cancel': return openCancel(v);
    case 'cr': CR = v; return openCancel.redraw();
    case 'doCancel': { const [id, mode] = v.split('|'); return doCancel(id, mode); }
    case 'mkup': return openMakeup(getEv(v));
    case 'noMk': return mutate('noMakeup', { id: v }, '振替なしにしました');
    case 'uncancel': {
      const x = getEv(v), cs = hard(conflictsOf({ ...x, status: 'active' }));
      if (cs.length) return alert('この時間には別の予定が入っているため、取り消せません。');
      return mutate('uncancel', { id: v }, 'キャンセルを取り消しました');
    }
    case 'del': case 'delete': {
      const id = v || D.editing, x = getEv(id);
      if (!confirm(`「${evTitle(x)}」${md(x.date)} を削除しますか？\n（レッスンのお休みは「お休み・キャンセル」を使うと記録が残ります）`)) return;
      return mutate('delete', { id }, '削除しました');
    }
    case 'toStudent': {
      // すでにその生徒の画面にいるなら、履歴は積まない（戻る1回で一覧に戻れるように）
      const same = UI.view === 'student' && UI.sid === v;
      // 日・週などの詳細から来たときは、戻るでその画面に帰る
      sidFrom = UI.view === 'student' ? null : UI.view;
      UI.sid = v; UI.view = 'student'; saveUI(); closeSheet(); if (!same) navPush({ sid: v }); return render();
    }
  }
  if (!D) return;
  switch (e) {
    case 'type':
      D.type = v;
      if (TYPES[v].rooms === 'multi') D.rooms = ROOMS.map(r => r.id);
      if (TYPES[v].teachers === 'mainsub' && !D.teachers.length && isTeacherLogin()) D.teachers = [UI.login];
      normalizeDraft(); break;
    case 'clearS': D.studentId = null; break;
    case 't-30': case 't+30': { const s = D.start + +e.slice(1); if (s >= DAY_START && s + SLOT <= DAY_END) { D.start = s; normalizeDraft(); } break; }
    case 'len': D.len = +v; normalizeDraft(); break;
    case 'room':
      if (TYPES[D.type].rooms === 'one') D.rooms = [v];
      else D.rooms = D.rooms.includes(v) ? D.rooms.filter(r => r !== v) : [...D.rooms, v].sort();
      break;
    case 'allRooms': D.rooms = D.rooms.length === ROOMS.length ? [] : ROOMS.map(r => r.id); break;
    case 'main': D.teachers = [v, ...D.teachers.slice(1).filter(t => t !== v)]; break;
    case 'sub': { const subs = D.teachers.slice(1); D.teachers = [D.teachers[0], ...(subs.includes(v) ? subs.filter(t => t !== v) : [...subs, v])]; break; }
    case 'tch':
      if (TYPES[D.type].teachers === 'one') D.teachers = [v];
      else D.teachers = D.teachers.includes(v) ? D.teachers.filter(t => t !== v) : [...D.teachers, v];
      break;
    case 'rep': D.repeat = v; break;
    case 'row': selectRow(+v); break;
    case 'rowDel': removeRow(+v); break;
    case 'addRow': addRow(v); break;
    case 'pick': D.date = v; break;
    case 'mode': D.mode = v; break;
    case 'wkp': D.wks = [...WK_PRESETS[+v][1]]; break;
    case 'wk': { const n = +v; if (D.wks.includes(n)) { if (D.wks.length > 1) D.wks = D.wks.filter(x => x !== n); } else D.wks = [...D.wks, n].sort(); break; }
    case 'untilK': D.untilKind = v; break;
    case 'contOn': D.cont = v === '1' ? { len: 30, teachers: [], room: '' } : null; break;
    case 'cLen': D.cont.len = +v; break;
    case 'cT': D.cont.teachers = [v]; break;
    case 'cRoom': D.cont.room = v; break;
    case 'yOpen': D.yOpen = v || null; break;
    case 'ySkip': { const it = weeklyItems().find(x => x.b === v); D.ov[v] = { ...D.ov[v], skip: !it.skip }; break; }
    case 'yReset': { const o = D.ov[v]; if (o && o.skip != null) D.ov[v] = { skip: o.skip }; else delete D.ov[v]; D.yOpen = null; break; }
    case 'ySkipBad': for (const it of weeklyPlan().its) if (!it.skip && hard(it.cs).length) D.ov[it.b] = { ...D.ov[it.b], skip: true }; break;
    case 'cal-1': case 'cal+1': { const d = pd(D.calM); d.setMonth(d.getMonth() + (e === 'cal-1' ? -1 : 1)); D.calM = ds(d); break; }
    case 'save': return saveDraft();
    default: return;
  }
  renderEditor();
}

history.replaceState({}, '');
if (!CFG.apiUrl || !CFG.clientId) { bootMsg = '設定（config.js）の apiUrl と clientId が空です'; render(); }
else if (token) start();
else { render(); openLogin(); }
</script>
